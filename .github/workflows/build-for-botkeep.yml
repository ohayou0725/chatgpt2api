name: Build for Botkeep

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-prepare:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出源码
        uses: actions/checkout@v4

      - name: 2. 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. 执行前端构建并生成 web_dist
        run: |
          if [ -f VERSION ]; then
            export NEXT_PUBLIC_APP_VERSION="$(cat VERSION | tr -d '\r\n')"
          fi
          cd web
          npm install
          npm run build
          cd ..
          rm -rf web_dist
          mv web/out ./web_dist

      - name: 4. 安装 uv 并导出标准 requirements.txt
        uses: astral-sh/setup-uv@v4

      - name: 5. 导出 Python 依赖并清理前端源码
        run: |
          uv export --format requirements-txt --no-hashes --no-dev > requirements.txt
          # 删除庞大的前端源码和 node_modules，只保留编译后的 web_dist
          rm -rf web .github

      - name: 6. 生成供手动上传备用的 ZIP 包 (Artifacts)
        run: |
          zip -r botkeep-ready.zip . -x "*.git*"

      - name: 7. 上传 ZIP 产物到 Actions 页面（可选下载）
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt2api-botkeep-zip
          path: botkeep-ready.zip
          retention-days: 7

      - name: 8. 强制推送到 botkeep-deploy 分支
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 确保生成的 web_dist 和 requirements.txt 不被 .gitignore 忽略
          sed -i '/web_dist/d' .gitignore || true
          sed -i '/requirements.txt/d' .gitignore || true
          
          git checkout --orphan temp-deploy-branch
          git rm -rf --cached .
          git add -A
          git reset -- botkeep-ready.zip || true
          git commit -m "chore: prebuild web_dist & requirements.txt for Botkeep ($(date +'%Y-%m-%d %H:%M'))"
          git branch -M botkeep-deploy
          git push -f origin botkeep-deploy
